# What a Python coding agent legitimately needs.
egress:
  default: deny
  allow_domains:
    - pypi.org
    - files.pythonhosted.org
    - github.com
    # Exact names: githubusercontent.com is a public suffix, so a wildcard
    # over it fails `sandwall policy lint`.
    - raw.githubusercontent.com
    - objects.githubusercontent.com
  allow_cidrs: []
limits:
  max_egress_bw: 50mbit
  max_ingress_bw: 200mbit
  max_conns: 64
  new_conns_per_sec: 20
  dns_qps: 50
