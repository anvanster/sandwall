name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make vet
      - run: make fmt-check
      # Unit tests only; tests that need root skip themselves. The e2e suites
      # need root and a disposable VM (and /dev/kvm for VM mode), so they are
      # run outside CI: see "Development" in the README.
      - run: make test
